<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="shortcut icon" href="/styles/contact.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <main class="card">
    <h1>Contact Form</h1>

    <form id="contact-form" novalidate>
      <div class="form-grid">
        <div class="field third">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="firstName">
          <span class="error" id="first-name-error"></span>
        </div>

        <div class="field third">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="lastName">
          <span class="error" id="last-name-error"></span>
        </div>

        <div class="field third">
          <label for="job-title">Job Title</label>
          <input type="text" id="job-title" name="jobTitle">
        </div>

        <div class="field third">
          <label for="company">Company</label>
          <input type="text" id="company" name="company">
        </div>

        <div class="field third">
          <label for="linkedin">LinkedIn URL</label>
          <input type="url" id="linkedin" name="linkedin">
          <span class="error" id="linkedin-error"></span>
        </div>

        <div class="field third">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email">
          <span class="error" id="email-error"></span>
        </div>

        <div class="field half">
          <label for="how-met">How did we meet?</label>
          <select id="how-met" name="howMet">
            <option value="">Please select</option>
            <option value="conference">Conference</option>
            <option value="linkedin">LinkedIn</option>
            <option value="referral">Referral</option>
            <option value="other">Other</option>
          </select>
          <span class="error" id="how-met-error"></span>
        </div>

        <div class="field half">
          <label for="other">Other (please specify)</label>
          <input type="text" id="other" name="other">
        </div>

        <div class="field full">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4"></textarea>
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="mailing-list" name="mailingList">
        <label for="mailing-list">Please add me to your mailing list</label>
      </div>

      <fieldset class="format-row">
        <legend>Choose an email format:</legend>
        <input type="radio" id="html" name="emailFormat" value="html" checked>
        <label for="html">HTML</label>
        <input type="radio" id="text" name="emailFormat" value="text">
        <label for="text">Text</label>
      </fieldset>

      <button type="submit">Submit</button>
    </form>
  </main>
  <script src="/scripts/script.js"></script>
</body>
</html>
